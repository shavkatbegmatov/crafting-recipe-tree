name: Build & Deploy

on:
  push:
    branches: [main]
  # Har qanday bazaga qaratilgan PR tekshiriladi. Ilgari faqat `main` edi, shuning
  # uchun bir PR ustiga qurilgan ikkinchi PR (stacked) umuman tekshirilmasdan qolardi.
  # Image'ni GHCR'ga push va deploy baribir faqat `main`da bo'ladi (quyidagi PUSH sharti).
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/shavkatbegmatov/crafting-recipe-tree

jobs:
  # ── CI: Frontend build check ──
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  # ── CI: Backend compile check ──
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn clean test -q

  # ── CI: E2E smoke (Playwright) ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── CI/CD: Build Docker images (PR: faqat qurish, main: qurish + GHCR'ga push) ──
  #
  # PR'da ham quriladi: Dockerfile buzilsa merge'dan KEYIN emas, PR'da bilinsin.
  # Ilgari bu qadam faqat main'da ishlardi va buzuq Dockerfile to'g'ridan-to'g'ri
  # deployni to'xtatib qo'yardi.
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, e2e]
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  # ── CD: Trigger Coolify deploy (backend + frontend as separate apps) ──
  #
  # Faqat O'ZGARGAN ilova deploy qilinadi. Ilgari har push ikkalasini ham qayta ishga
  # tushirardi: frontend'dagi kichik o'zgarish uchun ham backend qayta ko'tarilardi.
  # Server xotirasi tor (7.8 GB, ~10 loyiha) va yangi JVM ko'tarilayotganda eskisi hali
  # tirik bo'ladi — 2026-08-22 da aynan shu ortiqcha qayta ishga tushish OOM'ga olib keldi
  # va backend o'ldirildi. Keraksiz deploy — bekorga olingan xavf.
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
        with:
          # Oldingi commit bilan solishtirish uchun tarix kerak.
          fetch-depth: 0

      - name: Qaysi ilova o'zgarganini aniqlash
        id: changed
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          # Shubha bo'lsa IKKALASINI ham deploy qilamiz: deploy qilmay qolishdan
          # (eski kod ishlab turaveradi) ko'ra ortiqcha deploy xavfsizroq.
          known=yes
          case "$BEFORE" in
            ""|0000000000000000000000000000000000000000) known=no ;;
          esac
          if [ "$known" = "yes" ] && ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            known=no
          fi

          if [ "$known" = "no" ]; then
            echo "Oldingi commit aniqlanmadi (birinchi push yoki force-push) — ikkalasi ham deploy qilinadi"
            echo "backend=true"  >> "$GITHUB_OUTPUT"
            echo "frontend=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          files=$(git diff --name-only "$BEFORE" "${{ github.sha }}")
          echo "O'zgargan fayllar:"
          echo "$files" | sed 's/^/  /'

          backend=false; frontend=false
          echo "$files" | grep -q '^backend/'  && backend=true
          echo "$files" | grep -q '^frontend/' && frontend=true

          # Faqat hujjat/infra o'zgargan bo'lsa hech qaysi image o'zgarmaydi -> deploy shart emas.
          echo "backend=$backend"   >> "$GITHUB_OUTPUT"
          echo "frontend=$frontend" >> "$GITHUB_OUTPUT"
          echo "Natija: backend=$backend frontend=$frontend"

      # Coolify webhook o'z versiyasiga qarab POST yoki GET kutadi (yangilanishdan keyin
      # GET 405 qaytara boshladi). Shuning uchun ikkalasini ham sinaymiz va har bir
      # urinishning HTTP kodini chop etamiz — kelgusida diagnostika oson bo'ladi.
      - name: Deploy backend and frontend
        env:
          DEPLOY_BACKEND: ${{ steps.changed.outputs.backend }}
          DEPLOY_FRONTEND: ${{ steps.changed.outputs.frontend }}
          BACKEND_WEBHOOK: ${{ secrets.COOLIFY_BACKEND_WEBHOOK_URL }}
          FRONTEND_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          deploy() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then
              echo "$name: webhook URL sozlanmagan (secret bo'sh)"
              return 1
            fi
            for method in POST GET; do
              code=$(curl -s -o "/tmp/$name.out" -w '%{http_code}' \
                -X "$method" "$url" \
                -H "Authorization: Bearer $API_TOKEN" \
                --max-time 30 || echo 000)
              echo "$name: $method -> HTTP $code"
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                return 0
              fi
            done
            echo "$name: deploy webhook javob bermadi. Oxirgi javob tanasi:"
            cat "/tmp/$name.out" 2>/dev/null || true
            echo
            return 1
          }

          rc=0
          if [ "$DEPLOY_BACKEND" = "true" ]; then
            deploy backend "$BACKEND_WEBHOOK" || rc=1
          else
            echo "backend: o'zgarmagan — deploy o'tkazib yuborildi"
          fi
          if [ "$DEPLOY_FRONTEND" = "true" ]; then
            deploy frontend "$FRONTEND_WEBHOOK" || rc=1
          else
            echo "frontend: o'zgarmagan — deploy o'tkazib yuborildi"
          fi
          exit $rc
