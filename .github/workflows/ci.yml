name: Build & Deploy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/shavkatbegmatov/crafting-recipe-tree

jobs:
  # ── CI: Frontend build check ──
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build

  # ── CI: Backend compile check ──
  backend-ci:
    name: Backend CI
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: mvn clean test -q

  # ── CI: E2E smoke (Playwright) ──
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 7

  # ── CI/CD: Build Docker images (PR: faqat qurish, main: qurish + GHCR'ga push) ──
  #
  # PR'da ham quriladi: Dockerfile buzilsa merge'dan KEYIN emas, PR'da bilinsin.
  # Ilgari bu qadam faqat main'da ishlardi va buzuq Dockerfile to'g'ridan-to'g'ri
  # deployni to'xtatib qo'yardi.
  build-and-push:
    name: Build & Push Images
    runs-on: ubuntu-latest
    needs: [frontend-ci, backend-ci, e2e]
    permissions:
      contents: read
      packages: write
    env:
      PUSH: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        if: env.PUSH == 'true'
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Build & push backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-backend:latest
            ${{ env.IMAGE_PREFIX }}-backend:${{ github.sha }}
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Build & push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: ${{ env.PUSH == 'true' }}
          tags: |
            ${{ env.IMAGE_PREFIX }}-frontend:latest
            ${{ env.IMAGE_PREFIX }}-frontend:${{ github.sha }}
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend
          build-args: |
            VITE_API_BASE_URL=${{ secrets.VITE_API_BASE_URL }}

  # ── CD: Trigger Coolify deploy (backend + frontend as separate apps) ──
  deploy:
    name: Deploy to Coolify
    runs-on: ubuntu-latest
    needs: [build-and-push]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      # Coolify webhook o'z versiyasiga qarab POST yoki GET kutadi (yangilanishdan keyin
      # GET 405 qaytara boshladi). Shuning uchun ikkalasini ham sinaymiz va har bir
      # urinishning HTTP kodini chop etamiz — kelgusida diagnostika oson bo'ladi.
      - name: Deploy backend and frontend
        env:
          BACKEND_WEBHOOK: ${{ secrets.COOLIFY_BACKEND_WEBHOOK_URL }}
          FRONTEND_WEBHOOK: ${{ secrets.COOLIFY_FRONTEND_WEBHOOK_URL }}
          API_TOKEN: ${{ secrets.COOLIFY_API_TOKEN }}
        run: |
          deploy() {
            name="$1"; url="$2"
            if [ -z "$url" ]; then
              echo "$name: webhook URL sozlanmagan (secret bo'sh)"
              return 1
            fi
            for method in POST GET; do
              code=$(curl -s -o "/tmp/$name.out" -w '%{http_code}' \
                -X "$method" "$url" \
                -H "Authorization: Bearer $API_TOKEN" \
                --max-time 30 || echo 000)
              echo "$name: $method -> HTTP $code"
              if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
                return 0
              fi
            done
            echo "$name: deploy webhook javob bermadi. Oxirgi javob tanasi:"
            cat "/tmp/$name.out" 2>/dev/null || true
            echo
            return 1
          }

          rc=0
          deploy backend "$BACKEND_WEBHOOK" || rc=1
          deploy frontend "$FRONTEND_WEBHOOK" || rc=1
          exit $rc
