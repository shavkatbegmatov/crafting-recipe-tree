services:
  postgres:
    image: postgres:16-alpine
    container_name: crafting-recipe-db
    environment:
      POSTGRES_DB: ${DB_NAME:-crafttree}
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # Fon o'chirish (rembg) — alohida servis, chunki ML steki og'ir (~1.5 GB).
  # Backend uni faqat admin rasm yuklaganda chaqiradi; javob bermasa rasm asl
  # holida saqlanadi, ya'ni bu servis ishlamasa ham ilova ishlayveradi.
  rembg:
    image: ghcr.io/shavkatbegmatov/crafting-recipe-tree-rembg:latest
    container_name: crafting-recipe-tree-rembg
    restart: unless-stopped

  backend:
    image: ghcr.io/shavkatbegmatov/crafting-recipe-tree-backend:latest
    container_name: crafting-recipe-tree-backend
    depends_on:
      postgres:
        condition: service_healthy
      rembg:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      REMBG_URL: http://rembg:8000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-crafttree}
      DB_USERNAME: ${DB_USERNAME:-postgres}
      # Majburiy: .env'da o'rnatilmasa kompoz ishga tushmaydi (zaif default'larni oldini olish).
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD majburiy}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET majburiy}
    volumes:
      - uploads:/app/uploads
      # Zaxira fayllari (tiklashdan oldingi xavfsizlik nusxasi shu yerda qoladi).
      - backups:/app/backups
    networks:
      default:
        aliases:
          # Frontend nginx shu nom orqali murojaat qiladi. Umumiy `backend` nomi
          # ATAYLAB ishlatilmaydi: umumiy tarmoqda u boshqa loyihaga hal bo'lib
          # ketishi mumkin (Coolify'da aynan shunday bo'lgan).
          - crafttree-backend

  frontend:
    image: ghcr.io/shavkatbegmatov/crafting-recipe-tree-frontend:latest
    container_name: crafting-recipe-tree-frontend
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads:
  backups:
